[package]
name = "eyelash-sofle-left"
version = "0.1.0"
description = "Eyelash Sofle left half: split peripheral"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { version = "0.9.0", default-features = false, features = [
    # TEMPORARY, to debug the left link dropping: RMK's logs go to a USB serial port
    # (`cat /dev/cu.usbmodem*` on macOS) while the half is plugged in. Can't be combined with RMK's
    # `defmt` feature: swap back to "defmt" (and drop the USB code in main.rs and `log` below) when done.
    "usb_log",
    "storage",
    "split",
    "async_matrix",
    "adafruit_bl",
    "nrf52840_ble",
    # No display here, but the dongle has one: `display` adds split message variants, so all three
    # boards need it for the split protocol to match.
    "display",
] }
nrf-sdc = { version = "0.4.0", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { version = "0.4.0", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.10", features = ["defmt"] }
# TEMPORARY (with `usb_log` above): info level, so connects, disconnects and advertising show without a
# line per key press
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[[bin]]
name = "eyelash-sofle-left"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
