[package]
name = "eyelash-sofle-dongle"
version = "0.1.0"
description = "Eyelash Sofle USB dongle (Seeed XIAO BLE): split central, holds the keymap"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { version = "0.9.0", default-features = false, features = [
    "defmt",
    "storage",
    "vial",
    "split",
    "adafruit_bl",
    "nrf52840_ble",
    # The screen (see src/screen.rs). Implies `display`, which the halves must also enable.
    "st7789",
] }
embassy-embedded-hal = "0.6"
embassy-sync = "0.8"
embedded-graphics = "0.8"
heapless = "0.9"
nrf-sdc = { version = "0.4.0", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { version = "0.4.0", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.10", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

# Caps Word key lists for the Norwegian layout (see patches/README.md)
[patch.crates-io]
rmk-types = { path = "../patches/rmk-types" }

[[bin]]
name = "eyelash-sofle-dongle"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
