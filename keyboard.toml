# Compile-time constants for RMK, read by its build script through
# KEYBOARD_TOML_PATH (see .cargo/config.toml). Shared by all three firmwares.
# The keymap itself lives in dongle/src/keymap.rs.

[rmk]
# BT_SEL 0-4 in the old ZMK keymap
ble_profiles_num = 5
# The dongle is the central; the halves are peripherals 0 (left) and 1 (right)
split_peripherals_num = 2
# Same as CONFIG_ZMK_IDLE_SLEEP_TIMEOUT (1 hour)
split_central_sleep_timeout_seconds = 3600
