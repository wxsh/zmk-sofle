manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/4.1.0/develop/west/manifest.html#projects
    - name: carrefinho                            # Prospector dongle
      url-base: https://github.com/carrefinho     # Prospector dongle
    - name: janpfischer                           # zmk-dongle-screen
      url-base: https://github.com/janpfischer    # zmk-dongle-screen
  projects:
    # The eyelash_sofle board/shields come from this repo itself: the build workflow
    # loads it as a module via zephyr/module.yml, so it is not listed here.
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Prospector is not used by build.yaml. Its main branch only supports ZMK v0.3;
    # the Zephyr 4.1 port lives on the WIP feat/new-status-screens branch.
    # - name: prospector-zmk-module               # Prospector dongle
    #   remote: carrefinho                        # Prospector dongle
    #   revision: feat/new-status-screens         # Prospector dongle
    - name: zmk-dongle-screen                     # zmk-dongle-screen
      remote: janpfischer                         # zmk-dongle-screen
      revision: upgrade-4.1                       # Zephyr 4.1 branch (releases are v0.3-only)
  self:
    path: config
