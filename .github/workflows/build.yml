name: Build RMK firmware
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "keymap-drawer/**"
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            left
            right
            dongle

      # p256-cortex-m4-sys (BLE pairing crypto) compiles C for the target
      - name: Install ARM GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Install tools
        run: cargo install cargo-make cargo-binutils cargo-hex-to-uf2

      - name: Build UF2 images
        run: cargo make uf2
        env:
          # nrf-mpsl-sys/nrf-sdc-sys run bindgen for the target. With the ARM GCC installed, clang
          # picks up newlib's stdint.h, which leaves uint32_t undefined in CMSIS. Freestanding makes
          # clang use its own stdint.h instead.
          BINDGEN_EXTRA_CLANG_ARGS_thumbv7em_none_eabihf: -ffreestanding

      # RAM left for the stack: everything between the end of the statics (__sheap) and
      # _stack_start. A stack overflow corrupts the statics or locks up and resets the chip.
      - name: Dongle RAM usage
        working-directory: dongle
        run: |
          cargo size --release -- -A
          cargo nm --release -- --defined-only | grep -E ' (__sheap|_stack_start)$'

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/*.uf2
